<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課金機能付きECサイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Hobby Store</h1>
        <a href="/cart.html" class="cart-link">カートを見る (<span id="cart-count">0</span>)</a>
    </header>
    <main id="product-list">
        <!-- 商品はJavaScriptによってここに挿入されます -->
    </main>
    <footer>
        <p>&copy; 2025 My Hobby Store</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productList = document.getElementById('product-list');
            const cartCount = document.getElementById('cart-count');

            // カートの初期化と表示更新
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const updateCartCount = () => {
                cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            };
            updateCartCount();

            // サーバーから商品情報を取得
            fetch('/api/products')
                .then(response => response.json())
                .then(products => {
                    products.forEach(product => {
                        const productCard = document.createElement('div');
                        productCard.className = 'product-card';
                        const buttonHtml = product.stock > 0
                            ? `<button class="add-to-cart-button" data-product-id="${product.id}">カートに入れる</button>`
                            : `<button class="add-to-cart-button" disabled>売り切れ</button>`;

                        productCard.innerHTML = `
                            <img src="${product.image}" alt="${product.name}">
                            <div class="product-info">
                                <h2>${product.name}</h2>
                                <p class="description">${product.description}</p>
                                <p class="price">¥${product.price.toLocaleString()}</p>
                                ${buttonHtml}
                            </div>
                        `;
                        productList.appendChild(productCard);
                    });
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                    productList.innerHTML = '<p>商品の読み込みに失敗しました。</p>';
                });

            // 「カートに入れる」ボタンのクリックイベント
            productList.addEventListener('click', (event) => {
                if (event.target.classList.contains('add-to-cart-button')) {
                    const button = event.target;
                    const productId = button.dataset.productId;
                    
                    // カート内の既存商品を探す
                    const existingItem = cart.find(item => item.id === productId);

                    if (existingItem) {
                        // 商品が既にカートにあれば数量を増やす
                        existingItem.quantity++;
                    } else {
                        // なければ新しい商品として追加
                        cart.push({ id: productId, quantity: 1 });
                    }

                    // localStorageにカート情報を保存
                    localStorage.setItem('cart', JSON.stringify(cart));
                    
                    // カートの表示を更新
                    updateCartCount();

                    // ボタンのフィードバック
                    button.textContent = '追加しました！';
                    setTimeout(() => {
                        button.textContent = 'カートに入れる';
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
