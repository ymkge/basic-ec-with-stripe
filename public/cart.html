<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ショッピングカート</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Hobby Store</h1>
        <a href="/" class="cart-link">商品一覧へ戻る</a>
    </header>
    <main>
        <h2>ショッピングカート</h2>
        <div id="cart-items">
            <!-- カートの商品はJavaScriptによってここに挿入されます -->
        </div>
        <div id="cart-summary">
            <p>合計金額: <span id="total-price">¥0</span></p>
            <button id="checkout-button">決済に進む</button>
            <button id="clear-cart-button">カートを空にする</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 My Hobby Store</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('total-price');
            const checkoutButton = document.getElementById('checkout-button');
            const clearCartButton = document.getElementById('clear-cart-button');

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let allProducts = [];

            // サーバーから全商品情報を取得
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
            } catch (error) {
                console.error('Error fetching products:', error);
                cartItemsContainer.innerHTML = '<p>商品の読み込みに失敗しました。</p>';
                return;
            }

            const renderCart = () => {
                cartItemsContainer.innerHTML = '';
                let totalPrice = 0;

                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = '<p>カートは空です。</p>';
                    checkoutButton.disabled = true;
                    totalPriceEl.textContent = '¥0';
                    return;
                }

                cart.forEach(item => {
                    const product = allProducts.find(p => p.id === item.id);
                    if (product) {
                        const itemTotalPrice = product.price * item.quantity;
                        totalPrice += itemTotalPrice;

                        const cartItem = document.createElement('div');
                        cartItem.className = 'cart-item';
                        cartItem.innerHTML = `
                            <img src="${product.image}" alt="${product.name}">
                            <div class="product-info">
                                <h3>${product.name}</h3>
                                <p>単価: ¥${product.price.toLocaleString()}</p>
                                <div class="quantity-controls">
                                    <button class="decrease-quantity" data-product-id="${product.id}">-</button>
                                    <span>${item.quantity}</span>
                                    <button class="increase-quantity" data-product-id="${product.id}">+</button>
                                </div>
                                <p>小計: ¥${itemTotalPrice.toLocaleString()}</p>
                            </div>
                            <button class="remove-item" data-product-id="${product.id}">削除</button>
                        `;
                        cartItemsContainer.appendChild(cartItem);
                    }
                });

                totalPriceEl.textContent = `¥${totalPrice.toLocaleString()}`;
                checkoutButton.disabled = false;
            };

            const updateCartStorage = () => {
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            };

            // カート内商品の数量変更と削除
            cartItemsContainer.addEventListener('click', (event) => {
                const target = event.target;
                const productId = target.dataset.productId;
                if (!productId) return;

                const itemInCart = cart.find(item => item.id === productId);
                if (!itemInCart) return;

                if (target.classList.contains('increase-quantity')) {
                    itemInCart.quantity++;
                } else if (target.classList.contains('decrease-quantity')) {
                    if (itemInCart.quantity > 1) {
                        itemInCart.quantity--;
                    } else {
                        // 数量が1の時に-ボタンを押すと商品を削除
                        cart = cart.filter(item => item.id !== productId);
                    }
                } else if (target.classList.contains('remove-item')) {
                    cart = cart.filter(item => item.id !== productId);
                }
                
                updateCartStorage();
            });

            // カートを空にする
            clearCartButton.addEventListener('click', () => {
                if (confirm('カートを本当に空にしますか？')) {
                    cart = [];
                    updateCartStorage();
                }
            });

            // 決済に進む
            checkoutButton.addEventListener('click', async () => {
                checkoutButton.disabled = true;
                checkoutButton.textContent = '処理中...';

                try {
                    const response = await fetch('/create-checkout-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cart: cart }),
                    });

                    if (!response.ok) throw new Error('Checkout session creation failed');

                    const session = await response.json();
                    
                    // 決済成功後にカートを空にする
                    localStorage.removeItem('cart');

                    window.location.href = session.url;
                } catch (error) {
                    console.error('Error during checkout:', error);
                    alert('決済処理中にエラーが発生しました。');
                    checkoutButton.disabled = false;
                    checkoutButton.textContent = '決済に進む';
                }
            });

            renderCart();
        });
    </script>
</body>
</html>
